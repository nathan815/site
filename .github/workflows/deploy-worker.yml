name: Deploy worker

# Deploys the Cloudflare Worker in worker/ when it changes on master.
# Deliberately not triggered by pull_request, so forked PRs never see the secrets.
on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue instead of cancelling a deploy mid-flight.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Runs `npm run context` first and stamps the git short SHA as VERSION.
      - name: Deploy worker
        run: npm run deploy

      # Idempotent: only applies files in worker/migrations/ not yet applied.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nathancj-chat --remote --force
