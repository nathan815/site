name: Daily rebuild

# The GitHub activity data is fetched at build time (see netlify.toml), so it only
# changes when the site builds. This triggers a Netlify build once a day to refresh it.
# Setup: in Netlify > Site configuration > Build & deploy > Build hooks, create a hook
# and save its URL as the repository secret NETLIFY_BUILD_HOOK.
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the hour to avoid peak delays)
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
