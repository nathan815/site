name = "nathancj-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Browser origins allowed to call the API (CORS). Comma separated.
[vars]
ALLOWED_ORIGINS = "https://nathancj.com,http://localhost:4321"
# Chat (POST /api/chat). Verify the model id and pricing against the current Workers AI docs.
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
CHAT_PER_MINUTE = "5"        # per IP
CHAT_PER_DAY = "30"          # per IP, resets 00:00 UTC
CHAT_GLOBAL_PER_DAY = "150"  # all visitors. Measured ~15-60 neurons per question (full resume in the prompt + tool rounds), so 150 stays under the free 10k/day

# Workers AI. Always calls the real service, even under `wrangler dev`.
[ai]
binding = "AI"

# A single Durable Object counts requests to /api/status. SQLite-backed objects are
# the only kind available on the free plan.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

# Per-IP and global rate limit counters for /api/chat.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true
