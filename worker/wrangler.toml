name = "nathancj-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Browser origins allowed to call the API (CORS). Comma separated.
[vars]
ALLOWED_ORIGINS = "https://nathancj.com,http://localhost:4321"
# Chat (POST /api/chat). Verify the model id and pricing against the current Workers AI docs.
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
CHAT_PER_MINUTE = "5"        # per IP
CHAT_PER_DAY = "30"          # per IP, resets 00:00 UTC
LOG_RETENTION_DAYS = "90"
CHAT_GLOBAL_PER_DAY = "120"  # all visitors. Measured ~25-70 neurons per question (full resume in the prompt + tool rounds), so 120 stays under the free 10k/day

# Workers AI. Always calls the real service, even under `wrangler dev`.
[ai]
binding = "AI"

# A single Durable Object counts requests to /api/status. SQLite-backed objects are
# the only kind available on the free plan.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

# Per-IP and global rate limit counters for /api/chat.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# Chat conversation log (see migrations/ and the README). The id is pinned so CI deploys never
# try to auto-provision a new database (ids are not secrets). `wrangler dev` uses a local SQLite file.
[[d1_databases]]
binding = "DB"
database_name = "nathancj-chat"
database_id = "4685e357-85e6-4d12-9593-bc52aa1911c9"
migrations_dir = "migrations"

# Daily cleanup of old chat log rows (LOG_RETENTION_DAYS, default 90).
[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = true
